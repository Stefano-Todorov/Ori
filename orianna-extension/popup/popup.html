<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orianna</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      width: 320px;
      min-height: 200px;
      background: #09090b;
      color: #fafafa;
      padding: 16px;
    }
    h1 { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
    p { font-size: 12px; color: #a1a1aa; margin-bottom: 16px; }
    .status { display: flex; align-items: center; gap-8px; font-size: 12px; margin-bottom: 16px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #ef4444; margin-right: 8px; }
    .dot.connected { background: #22c55e; }
    button {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      margin-bottom: 8px;
      transition: opacity 0.2s;
    }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary { background: #fff; color: #09090b; }
    .btn-secondary { background: #27272a; color: #fafafa; }
    .btn-danger { background: #ef4444; color: #fff; }
    .result {
      background: #18181b;
      border-radius: 8px;
      padding: 12px;
      font-size: 12px;
      color: #a1a1aa;
      margin-top: 8px;
    }
    .result.success { border-left: 3px solid #22c55e; }
    .result.error { border-left: 3px solid #ef4444; }
    input {
      width: 100%;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #3f3f46;
      background: #18181b;
      color: #fafafa;
      font-size: 12px;
      margin-bottom: 8px;
    }
    label { font-size: 11px; color: #a1a1aa; display: block; margin-bottom: 4px; }
    .section { margin-bottom: 16px; }
  </style>
</head>
<body>
  <h1>Orianna</h1>
  <p id="subtitle">AI Content Coach</p>

  <div class="section">
    <div class="status">
      <span class="dot" id="dot"></span>
      <span id="status-text">Checking connection...</span>
    </div>
  </div>

  <div class="section" id="capture-section" style="display:none">
    <button class="btn-primary" id="capture-btn">Capture this profile</button>
    <button class="btn-secondary" id="capture-trending-btn">Tag as trending</button>
  </div>

  <div class="section" id="settings-section">
    <label>Orianna URL (change if not on localhost)</label>
    <input type="text" id="api-base-input" placeholder="http://localhost:3000" />
    <button class="btn-secondary" id="save-url-btn">Save URL</button>
  </div>

  <div id="result" class="result" style="display:none"></div>

  <script src="popup.js"></script>
</body>
</html>
