<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
  body {
    width: 1080px;
    height: 1080px;
    font-family: 'Inter', sans-serif;
    background: #0a0a0f;
    color: white;
    overflow: hidden;
    position: relative;
  }
  .accent-line { position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, #7c3aed, #a855f7); }
  .content { display: flex; flex-direction: column; height: 100%; padding: 80px; }
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 60px; }
  .num { font-size: 80px; font-weight: 900; background: linear-gradient(135deg, rgba(124,58,237,0.4), rgba(124,58,237,0.1)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .icon-box { width: 80px; height: 80px; background: rgba(124,58,237,0.12); border: 1px solid rgba(124,58,237,0.3); border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 40px; }
  h2 { font-size: 52px; font-weight: 900; line-height: 1.1; letter-spacing: -0.02em; margin-bottom: 24px; }
  .gradient { background: linear-gradient(135deg, #7c3aed, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .desc { font-size: 24px; color: #9ca3af; line-height: 1.6; margin-bottom: 48px; max-width: 750px; }
  .mockup {
    flex: 1;
    background: #12121a;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 28px;
  }
  .ext-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
  }
  .ext-header svg { width: 24px; height: 24px; }
  .ext-header span { font-size: 18px; font-weight: 700; background: linear-gradient(135deg, #7c3aed, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .detected {
    background: rgba(124,58,237,0.08);
    border: 1px solid rgba(124,58,237,0.2);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .detected-label { font-size: 14px; color: #a855f7; font-weight: 600; margin-bottom: 8px; }
  .detected-title { font-size: 18px; color: #d1d5db; margin-bottom: 10px; }
  .metrics { display: flex; gap: 24px; font-size: 15px; color: #6b7280; }
  .buttons { display: flex; gap: 12px; }
  .btn-save {
    flex: 1;
    background: linear-gradient(135deg, #7c3aed, #9333ea);
    border-radius: 10px;
    padding: 14px;
    text-align: center;
    font-size: 16px;
    font-weight: 600;
  }
  .btn-idea {
    flex: 1;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    padding: 14px;
    text-align: center;
    font-size: 16px;
    font-weight: 600;
    color: #d1d5db;
  }
  .dots { position: absolute; bottom: 48px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.15); }
  .dot:nth-child(6) { background: #a855f7; width: 28px; border-radius: 5px; }
</style>
</head>
<body>
  <div class="accent-line"></div>
  <div class="content">
    <div class="header">
      <div class="num">05</div>
      <div class="icon-box">🔥</div>
    </div>
    <h2><span class="gradient">Chrome</span><br>Extension</h2>
    <p class="desc">Save trending videos while you scroll. One click captures everything — views, likes, comments, engagement.</p>
    <div class="mockup">
      <div class="ext-header">
        <svg viewBox="0 0 64 64"><path d="M32,4 C36,24 40,28 60,32 C40,36 36,40 32,60 C28,40 24,36 4,32 C24,28 28,24 32,4 Z" fill="#a855f7"/></svg>
        <span>Orianna</span>
      </div>
      <div class="detected">
        <div class="detected-label">Detected TikTok Video</div>
        <div class="detected-title">@fitnesscreator &middot; "5 mistakes killing your gains"</div>
        <div class="metrics">
          <span>👁 2.4M views</span>
          <span>❤️ 340K likes</span>
          <span>💬 8.2K comments</span>
        </div>
      </div>
      <div class="buttons">
        <div class="btn-save">Save to Swipe File</div>
        <div class="btn-idea">Create Idea</div>
      </div>
    </div>
  </div>
  <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
</body>
</html>
