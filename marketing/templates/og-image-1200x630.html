<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
  body {
    width: 1200px;
    height: 630px;
    font-family: 'Inter', sans-serif;
    background: #0a0a0f;
    color: white;
    overflow: hidden;
    position: relative;
  }
  .glow {
    position: absolute;
    top: -200px;
    left: 50%;
    transform: translateX(-50%);
    width: 900px;
    height: 600px;
    background: radial-gradient(ellipse 70% 60%, rgba(124,58,237,0.35) 0%, transparent 70%);
  }
  .border-line {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: linear-gradient(90deg, #7c3aed, #a855f7, #ec4899, #a855f7, #7c3aed);
  }
  .content {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    padding: 60px 80px;
    text-align: center;
  }
  .logo-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 32px;
  }
  .logo-row svg { width: 40px; height: 40px; }
  .logo-row span {
    font-size: 36px;
    font-weight: 800;
    background: linear-gradient(135deg, #7c3aed, #a855f7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  h1 {
    font-size: 56px;
    font-weight: 900;
    line-height: 1.1;
    letter-spacing: -0.03em;
    margin-bottom: 20px;
  }
  .gradient {
    background: linear-gradient(135deg, #7c3aed, #a855f7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .sub {
    font-size: 22px;
    color: #9ca3af;
    line-height: 1.4;
  }
  .pills {
    display: flex;
    gap: 12px;
    margin-top: 28px;
  }
  .pill {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 999px;
    padding: 8px 20px;
    font-size: 14px;
    color: #d1d5db;
    font-weight: 500;
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="border-line"></div>
  <div class="content">
    <div class="logo-row">
      <svg viewBox="0 0 64 64">
        <defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#c084fc"/><stop offset="100%" stop-color="#7c3aed"/></linearGradient></defs>
        <path d="M32,4 C36,24 40,28 60,32 C40,36 36,40 32,60 C28,40 24,36 4,32 C24,28 28,24 32,4 Z" fill="url(#g)"/>
      </svg>
      <span>Orianna</span>
    </div>
    <h1>Your <span class="gradient">AI coach</span> for<br>short-form video</h1>
    <p class="sub">Generate scripts, track competitors, and plan your content calendar.</p>
    <div class="pills">
      <span class="pill">AI Coach</span>
      <span class="pill">Script Generator</span>
      <span class="pill">Ideas Board</span>
      <span class="pill">Competitor Research</span>
    </div>
  </div>
</body>
</html>
