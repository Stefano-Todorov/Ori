<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
  body {
    width: 1080px;
    height: 1080px;
    font-family: 'Inter', sans-serif;
    background: #0a0a0f;
    color: white;
    overflow: hidden;
    position: relative;
  }
  .glow {
    position: absolute;
    top: -100px;
    left: 50%;
    transform: translateX(-50%);
    width: 900px;
    height: 700px;
    background: radial-gradient(ellipse, rgba(124,58,237,0.4) 0%, transparent 70%);
  }
  .content {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    padding: 80px;
    text-align: center;
  }
  .slide-num {
    font-size: 16px;
    color: #6b7280;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 40px;
  }
  h1 {
    font-size: 68px;
    font-weight: 900;
    line-height: 1.08;
    letter-spacing: -0.03em;
    margin-bottom: 28px;
  }
  .gradient {
    background: linear-gradient(135deg, #7c3aed, #a855f7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .sub {
    font-size: 26px;
    color: #9ca3af;
    line-height: 1.5;
    max-width: 700px;
    margin-bottom: 48px;
  }
  .swipe {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #a855f7;
    font-size: 18px;
    font-weight: 600;
  }
  .swipe .arrow {
    font-size: 24px;
  }
  .dots {
    position: absolute;
    bottom: 48px;
    display: flex;
    gap: 8px;
  }
  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
  }
  .dot.active {
    background: #a855f7;
    width: 28px;
    border-radius: 5px;
  }
  .logo {
    position: absolute;
    top: 48px;
    left: 80px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .logo svg { width: 28px; height: 28px; }
  .logo span {
    font-size: 24px;
    font-weight: 700;
    background: linear-gradient(135deg, #7c3aed, #a855f7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="logo">
    <svg viewBox="0 0 64 64"><defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#c084fc"/><stop offset="100%" stop-color="#7c3aed"/></linearGradient></defs><path d="M32,4 C36,24 40,28 60,32 C40,36 36,40 32,60 C28,40 24,36 4,32 C24,28 28,24 32,4 Z" fill="url(#g)"/></svg>
    <span>Orianna</span>
  </div>
  <div class="content">
    <div class="slide-num">Carousel &middot; 5 slides</div>
    <h1><span class="gradient">5 features</span><br>that changed<br>my content game</h1>
    <p class="sub">Here's how I went from stressing about content to having a week planned in 10 minutes.</p>
    <div class="swipe">Swipe to see all <span class="arrow">&rarr;</span></div>
  </div>
  <div class="dots">
    <div class="dot active"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>
</body>
</html>
