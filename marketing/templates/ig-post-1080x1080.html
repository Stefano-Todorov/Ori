<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
  body {
    width: 1080px;
    height: 1080px;
    font-family: 'Inter', sans-serif;
    background: #0a0a0f;
    color: white;
    overflow: hidden;
    position: relative;
  }
  .glow {
    position: absolute;
    top: -200px;
    left: 50%;
    transform: translateX(-50%);
    width: 800px;
    height: 800px;
    background: radial-gradient(circle, rgba(124,58,237,0.3) 0%, transparent 70%);
    pointer-events: none;
  }
  .content {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    padding: 80px;
    text-align: center;
  }
  .badge {
    background: rgba(124,58,237,0.15);
    border: 1px solid rgba(124,58,237,0.5);
    color: #a855f7;
    border-radius: 999px;
    padding: 8px 20px;
    font-size: 16px;
    font-weight: 500;
    margin-bottom: 40px;
  }
  h1 {
    font-size: 72px;
    font-weight: 900;
    line-height: 1.05;
    letter-spacing: -0.03em;
    margin-bottom: 24px;
  }
  .gradient {
    background: linear-gradient(135deg, #7c3aed, #a855f7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .sub {
    font-size: 24px;
    color: #9ca3af;
    line-height: 1.5;
    max-width: 700px;
    margin-bottom: 48px;
  }
  .cta {
    background: linear-gradient(135deg, #7c3aed, #9333ea);
    color: white;
    font-weight: 700;
    font-size: 22px;
    padding: 18px 48px;
    border-radius: 12px;
    box-shadow: 0 0 40px rgba(124,58,237,0.35);
  }
  .logo {
    position: absolute;
    bottom: 48px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .logo svg { width: 28px; height: 28px; }
  .logo span {
    font-size: 24px;
    font-weight: 700;
    background: linear-gradient(135deg, #7c3aed, #a855f7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="content">
    <div class="badge">✨ AI-powered content coach</div>
    <h1>Stop guessing.<br><span class="gradient">Start creating.</span></h1>
    <p class="sub">AI that generates scripts, tracks competitors, and plans your content calendar.</p>
    <div class="cta">Try Orianna free</div>
  </div>
  <div class="logo">
    <svg viewBox="0 0 64 64">
      <defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#c084fc"/><stop offset="100%" stop-color="#7c3aed"/></linearGradient></defs>
      <path d="M32,4 C36,24 40,28 60,32 C40,36 36,40 32,60 C28,40 24,36 4,32 C24,28 28,24 32,4 Z" fill="url(#g)"/>
    </svg>
    <span>Orianna</span>
  </div>
</body>
</html>
