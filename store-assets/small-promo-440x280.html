<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 440px; height: 280px; overflow: hidden;
    font-family: 'Inter', sans-serif;
    background: #0a0a12;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  body::before {
    content: ''; position: absolute; inset: 0;
    background-image: radial-gradient(circle at 1px 1px, rgba(168,85,247,0.06) 1px, transparent 0);
    background-size: 24px 24px;
  }
  .glow {
    position: absolute; width: 250px; height: 250px;
    background: radial-gradient(circle, rgba(147,51,234,0.2) 0%, transparent 70%);
    top: 50%; left: 50%; transform: translate(-50%, -50%);
  }
  .content { position: relative; z-index: 1; text-align: center; padding: 0 32px; }
  h1 {
    font-size: 32px; font-weight: 800; letter-spacing: -1px;
    background: linear-gradient(to right, #a855f7, #c084fc);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    margin-bottom: 6px;
  }
  .tagline { font-size: 11px; font-weight: 600; color: #71717a; margin-bottom: 14px; }
  p { font-size: 13px; color: #a1a1aa; line-height: 1.5; max-width: 340px; margin: 0 auto; }
  .badges { display: flex; gap: 8px; justify-content: center; margin-top: 16px; }
  .badge {
    font-size: 10px; font-weight: 600; padding: 4px 12px; border-radius: 20px;
    background: rgba(168,85,247,0.12); color: #c084fc;
    border: 1px solid rgba(168,85,247,0.2);
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="content">
    <h1>Orianna</h1>
    <div class="tagline">AI Content Coach</div>
    <p>Capture inspo, generate AI video ideas, and track competitors while browsing TikTok & Instagram</p>
    <div class="badges">
      <span class="badge">TikTok</span>
      <span class="badge">Instagram</span>
      <span class="badge">AI Ideas</span>
      <span class="badge">Scripts</span>
    </div>
  </div>
</body>
</html>
