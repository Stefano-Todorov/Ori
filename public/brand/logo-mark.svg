<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#1a1025"/>
    </linearGradient>
    <linearGradient id="spark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="120" height="120" rx="26" fill="url(#bg)"/>
  <!-- Subtle border -->
  <rect x="1" y="1" width="118" height="118" rx="25" fill="none" stroke="#7c3aed" stroke-width="1.5" opacity="0.25"/>
  <!-- Main 4-point star -->
  <path d="M60,12 C64,44 76,56 108,60 C76,64 64,76 60,108 C56,76 44,64 12,60 C44,56 56,44 60,12 Z" fill="url(#spark)"/>
  <!-- Inner glow star -->
  <path d="M60,32 C62,52 68,58 88,60 C68,62 62,68 60,88 C58,68 52,62 32,60 C52,58 58,52 60,32 Z" fill="#e9d5ff" opacity="0.4"/>
  <!-- Center glow -->
  <circle cx="60" cy="60" r="8" fill="#e9d5ff" opacity="0.7"/>
  <circle cx="60" cy="60" r="4" fill="white" opacity="0.9"/>
  <!-- Accent spark -->
  <path d="M92,24 L94,30 L100,32 L94,34 L92,40 L90,34 L84,32 L90,30 Z" fill="#c084fc" opacity="0.55"/>
</svg>
