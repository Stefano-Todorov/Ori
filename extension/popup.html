<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orianna</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      background: #09090b;
      color: #fafafa;
      min-height: 200px;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px 10px;
      border-bottom: 1px solid #27272a;
    }
    .logo { font-weight: 700; font-size: 15px; letter-spacing: -0.3px; }
    .user-email { font-size: 11px; color: #71717a; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .logout-btn { font-size: 11px; cursor: pointer; background: none; border: none; color: #71717a; }
    .logout-btn:hover { color: #ef4444; }

    /* Login form */
    .login-section { padding: 16px 14px; }
    .login-section h2 { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
    .login-section p { color: #71717a; font-size: 12px; margin-bottom: 14px; }

    /* Detected data panel */
    .detected {
      margin: 10px 14px;
      padding: 10px 12px;
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 8px;
    }
    .detected-row { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
    .platform-badge {
      font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 4px;
      background: #27272a; color: #a1a1aa; text-transform: uppercase;
    }
    .detected-handle { font-size: 12px; color: #e4e4e7; font-weight: 500; }
    .competitor-tag {
      font-size: 9px; font-weight: 600; padding: 2px 6px; border-radius: 4px;
      background: rgba(99, 102, 241, 0.15); color: #818cf8; text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .stats-row { display: flex; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
    .stat-num { font-size: 13px; font-weight: 600; }
    .stat-num.eng { color: #fbbf24; }
    .stat-label { font-size: 10px; color: #71717a; }

    .tracked-info { font-size: 11px; color: #818cf8; margin-bottom: 6px; }

    .detected-caption { font-size: 11px; color: #a1a1aa; line-height: 1.4; margin-bottom: 4px; }

    .hashtag-row { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 4px; }
    .hashtag { font-size: 10px; color: #6366f1; background: rgba(99, 102, 241, 0.1); padding: 1px 5px; border-radius: 3px; }

    .audio-row { font-size: 11px; color: #71717a; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* Not on a post */
    .no-post {
      padding: 24px 14px;
      text-align: center;
      color: #71717a;
      font-size: 12px;
      line-height: 1.5;
    }

    /* Notes */
    .notes-row { padding: 0 14px; margin-bottom: 4px; }

    /* Actions */
    .actions { padding: 8px 14px 14px; display: flex; flex-direction: column; gap: 6px; }

    /* Ideas result */
    .ideas-result { padding: 10px 14px 14px; }
    .ideas-result h3 { font-size: 13px; font-weight: 600; margin-bottom: 10px; color: #4ade80; }
    .idea-item { padding: 8px 10px; background: #18181b; border: 1px solid #27272a; border-radius: 6px; margin-bottom: 6px; }
    .idea-num { font-size: 10px; color: #71717a; margin-bottom: 2px; }
    .idea-text { font-size: 12px; line-height: 1.4; }
    .idea-hook { font-size: 11px; color: #a1a1aa; margin-top: 3px; font-style: italic; }

    /* Shared */
    input, select {
      width: 100%;
      padding: 7px 10px;
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 6px;
      color: #fafafa;
      font-size: 12px;
      outline: none;
    }
    input:focus, select:focus { border-color: #6366f1; }
    input::placeholder { color: #52525b; }

    .btn {
      width: 100%;
      padding: 9px 12px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: all 0.15s;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: #6366f1; color: #fff; }
    .btn-primary:hover:not(:disabled) { background: #4f46e5; }
    .btn-outline { background: transparent; color: #fafafa; border: 1px solid #27272a; }
    .btn-outline:hover:not(:disabled) { background: #18181b; border-color: #3f3f46; }
    .btn-ai { background: linear-gradient(135deg, #312e81, #1e1b4b); color: #c7d2fe; border: 1px solid #4338ca; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-ai:hover:not(:disabled) { border-color: #6366f1; color: #e0e7ff; }
    .btn-link { background: none; border: none; color: #6366f1; font-size: 12px; cursor: pointer; padding: 4px 0; text-align: center; width: 100%; text-decoration: none; display: block; }

    .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-msg { font-size: 11px; color: #ef4444; text-align: center; padding: 2px 0; }
    .success-msg { font-size: 11px; color: #4ade80; text-align: center; padding: 2px 0; }

    .divider { height: 1px; background: #27272a; margin: 2px 0; }

    /* Profile view */
    .profile-header {
      margin: 10px 14px;
      padding: 10px 12px;
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 8px;
    }
    .profile-actions { padding: 0 14px 8px; }

    .sort-bar {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 14px 4px;
    }
    .sort-label { font-size: 10px; color: #71717a; text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap; }
    .sort-pills { display: flex; gap: 4px; }
    .pill {
      font-size: 10px; padding: 3px 8px; border-radius: 10px;
      background: #27272a; color: #a1a1aa; border: none; cursor: pointer;
      transition: all 0.15s;
    }
    .pill:hover { background: #3f3f46; color: #e4e4e7; }
    .pill.active { background: #6366f1; color: #fff; }

    .video-list {
      max-height: 300px; overflow-y: auto;
      margin: 4px 14px 10px;
      border: 1px solid #27272a; border-radius: 8px;
    }
    .video-list::-webkit-scrollbar { width: 4px; }
    .video-list::-webkit-scrollbar-track { background: #18181b; }
    .video-list::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 2px; }

    .video-row {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 10px;
      border-bottom: 1px solid #1c1c1f;
      font-size: 12px;
      transition: background 0.1s;
    }
    .video-row:last-child { border-bottom: none; }
    .video-row:hover { background: #18181b; }
    .video-row .vid-rank { font-size: 10px; color: #52525b; min-width: 18px; }
    .video-row .vid-views { font-weight: 600; color: #e4e4e7; min-width: 50px; }
    .video-row .vid-title { flex: 1; color: #a1a1aa; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .video-row .vid-open {
      font-size: 10px; color: #6366f1; background: none; border: none;
      cursor: pointer; white-space: nowrap;
    }
    .video-row .vid-open:hover { color: #818cf8; }
    .video-row .vid-save {
      font-size: 11px; color: #71717a; background: none; border: 1px solid #27272a;
      border-radius: 4px; padding: 2px 6px; cursor: pointer; white-space: nowrap;
    }
    .video-row .vid-save:hover { border-color: #4ade80; color: #4ade80; }
    .video-row .vid-save.saved { color: #4ade80; border-color: #4ade80; pointer-events: none; }

    .profile-note { font-size: 11px; color: #52525b; text-align: center; padding: 8px 14px; }
    .video-count { font-size: 11px; color: #71717a; padding: 0 14px; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="popup.js"></script>
</body>
</html>
