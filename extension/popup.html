<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orianna</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 420px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      background: #0f0f13;
      color: #fafafa;
      min-height: 200px;
      border-radius: 12px;
      overflow: hidden;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .logo {
      font-weight: 700; font-size: 18px; letter-spacing: -0.5px;
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .header-right { display: flex; align-items: center; gap: 8px; }
    .user-email { font-size: 10px; color: #52525b; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .logout-btn { font-size: 10px; cursor: pointer; background: none; border: none; color: #52525b; transition: color 0.15s; }
    .logout-btn:hover { color: #e4e4e7; }

    /* Login form */
    .login-section { padding: 20px 18px; }
    .login-section h2 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
    .login-section p { color: #52525b; font-size: 12px; margin-bottom: 16px; }

    /* Post info card */
    .detected {
      margin: 12px 16px;
      padding: 14px;
      background: #1a1a2e;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
    }
    .detected-row { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
    .detected-handle { font-size: 14px; color: #fff; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    .platform-badge {
      font-size: 10px; font-weight: 700; padding: 3px 10px; border-radius: 20px;
      color: #fff; text-transform: uppercase;
      letter-spacing: 0.05em; flex-shrink: 0;
    }
    .platform-badge.tiktok { background: linear-gradient(135deg, #ff0050, #00f2ea); }
    .platform-badge.instagram { background: linear-gradient(135deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
    .platform-badge.youtube { background: linear-gradient(135deg, #ff0000, #cc0000); }
    .competitor-tag {
      font-size: 9px; font-weight: 600; padding: 2px 8px; border-radius: 20px;
      background: transparent; color: #2dd4bf; text-transform: uppercase;
      letter-spacing: 0.04em; border: 1px solid rgba(45, 212, 191, 0.4); flex-shrink: 0;
    }

    .detected-caption {
      font-size: 12px; color: #9ca3af; line-height: 1.5; margin: 8px 0;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }

    /* Stats row (inline) */
    .stats-row { display: flex; gap: 12px; margin-top: 8px; flex-wrap: wrap; align-items: center; }
    .stat-num { font-size: 13px; font-weight: 700; color: #fff; }
    .stat-num.stat-eng { color: #fbbf24; }
    .stat-label { font-size: 10px; color: #52525b; margin-left: 2px; }

    .tracked-info { font-size: 11px; color: #a78bfa; margin-bottom: 6px; }

    .hashtag-row { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 4px; }
    .hashtag { font-size: 10px; color: #a78bfa; background: rgba(124, 58, 237, 0.1); padding: 2px 6px; border-radius: 4px; }

    .audio-row { font-size: 11px; color: #52525b; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* Not on a post */
    .no-post {
      padding: 32px 18px;
      text-align: center;
      color: #52525b;
      font-size: 12px;
      line-height: 1.6;
    }

    /* Notes */
    .notes-row { padding: 0 18px; margin-bottom: 4px; }

    /* Actions */
    .actions { padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 8px; }

    /* Ideas result */
    .ideas-result { padding: 12px 18px 16px; }
    .ideas-result h3 { font-size: 13px; font-weight: 600; margin-bottom: 10px; color: #4ade80; }
    .idea-item { padding: 10px 12px; background: #1a1a2e; border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; margin-bottom: 8px; }
    .idea-num { font-size: 10px; color: #52525b; margin-bottom: 2px; }
    .idea-text { font-size: 12px; line-height: 1.5; }
    .idea-hook { font-size: 11px; color: #71717a; margin-top: 4px; font-style: italic; }

    /* Shared */
    input, select {
      width: 100%;
      padding: 8px 12px;
      background: #1a1a2e;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      color: #fafafa;
      font-size: 12px;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus, select:focus { border-color: #7c3aed; }
    input::placeholder { color: #3f3f46; }

    /* Button base */
    .btn {
      width: 100%;
      height: 44px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn:hover:not(:disabled) { transform: translateY(-1px); }
    .btn:active:not(:disabled) { transform: translateY(0); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Primary CTA — Save as Inspiration */
    .btn-primary {
      height: 48px;
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      color: #fff;
      box-shadow: 0 4px 20px rgba(124,58,237,0.4);
    }
    .btn-primary:hover:not(:disabled) { filter: brightness(1.15); box-shadow: 0 6px 24px rgba(124,58,237,0.5); }

    /* Secondary CTA — Get Video Idea */
    .btn-secondary {
      height: 46px;
      background: #5b21b6;
      color: #fff;
      box-shadow: 0 2px 12px rgba(124,58,237,0.2);
    }
    .btn-secondary:hover:not(:disabled) { filter: brightness(1.15); box-shadow: 0 4px 16px rgba(124,58,237,0.3); }

    /* Analytical — Why Did It Do Well */
    .btn-outline {
      background: transparent;
      color: #a855f7;
      border: 1.5px solid rgba(168,85,247,0.5);
    }
    .btn-outline:hover:not(:disabled) { background: rgba(124,58,237,0.1); border-color: rgba(168,85,247,0.8); }

    /* Utility — Download Video */
    .btn-ghost {
      background: rgba(255,255,255,0.05);
      color: #a1a1aa;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .btn-ghost:hover:not(:disabled) { background: rgba(255,255,255,0.1); color: #e4e4e7; border-color: rgba(255,255,255,0.15); }

    .btn-link { background: none; border: none; color: #a78bfa; font-size: 12px; cursor: pointer; padding: 4px 0; text-align: center; width: 100%; text-decoration: none; display: block; }

    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-msg { font-size: 11px; color: #ef4444; text-align: center; padding: 2px 0; }
    .success-msg { font-size: 11px; color: #4ade80; text-align: center; padding: 2px 0; }

    .divider { height: 1px; background: rgba(255,255,255,0.06); margin: 2px 0; }

    /* Competitor / Duplicate prompt */
    .competitor-prompt {
      padding: 10px 12px;
      background: #1a1a2e;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
    }
    .competitor-prompt-text { font-size: 12px; color: #71717a; margin-bottom: 8px; }
    .competitor-prompt-actions { display: flex; align-items: center; gap: 8px; }
    .btn-prompt-yes, .btn-prompt-no {
      padding: 6px 16px; font-size: 11px; font-weight: 600;
      border-radius: 8px; cursor: pointer; border: none;
      transition: all 0.2s ease;
    }
    .btn-prompt-yes { background: linear-gradient(135deg, #7c3aed, #a855f7); color: #fff; }
    .btn-prompt-yes:hover { filter: brightness(1.1); transform: translateY(-1px); }
    .btn-prompt-no { background: rgba(255,255,255,0.05); color: #71717a; border: 1px solid rgba(255,255,255,0.1); }
    .btn-prompt-no:hover { background: rgba(255,255,255,0.08); color: #e4e4e7; }
    .dont-ask-label {
      font-size: 10px; color: #3f3f46; display: flex; align-items: center; gap: 4px;
      cursor: pointer; margin-left: auto; user-select: none;
    }
    .dont-ask-label input { width: 12px; height: 12px; accent-color: #7c3aed; }

    /* Analysis result */
    .analysis-result {
      margin: 8px 16px 12px;
      padding: 12px 14px;
      background: #1a1a2e;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
    }
    .analysis-title { font-size: 12px; font-weight: 600; color: #4ade80; margin-bottom: 8px; }
    .analysis-text { font-size: 11px; color: #71717a; line-height: 1.6; }
    .analysis-bullet { margin-bottom: 4px; }
    .analysis-bullet strong { color: #e4e4e7; }

    /* Profile view */
    .profile-header {
      margin: 12px 16px 8px;
      padding: 10px 14px;
      background: #1a1a2e;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .profile-actions { padding: 0 16px 8px; }

    .sort-label { font-size: 11px; color: #52525b; text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap; font-weight: 600; }

    /* Sort controls */
    .sort-box {
      margin: 8px 16px;
      padding: 12px 14px;
      background: #1a1a2e;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
    }
    .sort-controls {
      display: flex; align-items: center; gap: 8px;
      flex-wrap: nowrap;
    }
    .sort-controls select {
      width: auto; padding: 7px 12px; font-size: 12px;
      background: #16162a; border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px; flex-shrink: 0;
    }
    .sort-controls .btn { width: auto; padding: 9px 20px; font-size: 13px; flex-shrink: 0; margin-left: auto; height: auto; }

    /* Sorted list */
    .sorted-list {
      max-height: 460px;
      overflow-y: auto;
      padding: 8px 16px 10px;
    }
    .sorted-list::-webkit-scrollbar { width: 4px; }
    .sorted-list::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 2px; }
    .sorted-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px;
      background: #1a1a2e;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      margin-bottom: 8px;
      text-decoration: none;
      color: #fafafa;
      transition: all 0.2s ease;
    }
    .sorted-item:hover { background: #22223a; border-color: rgba(255,255,255,0.12); }
    .sorted-rank {
      font-size: 22px; font-weight: 700;
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      min-width: 32px; text-align: center;
    }
    .sorted-thumb {
      width: 56px; height: 56px; border-radius: 8px;
      object-fit: cover; background: #27272a; flex-shrink: 0;
    }
    .sorted-metrics { flex: 1; min-width: 0; }
    .sorted-metric-row {
      display: flex; gap: 12px; font-size: 12px; color: #71717a;
    }
    .sorted-metric-row .val { font-weight: 700; color: #fff; }
    .sorted-metric-row .primary {
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; font-weight: 700;
    }
    .sorted-actions {
      display: flex; gap: 4px; flex-shrink: 0;
    }
    .sorted-actions button {
      padding: 5px 12px; font-size: 10px; font-weight: 600;
      border-radius: 6px; cursor: pointer; border: none;
      transition: all 0.2s ease; white-space: nowrap;
    }
    .btn-open {
      background: rgba(255,255,255,0.05); color: #71717a;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .btn-open:hover { background: rgba(255,255,255,0.1); color: #e4e4e7; transform: translateY(-1px); }
    .btn-goto {
      background: linear-gradient(135deg, #7c3aed, #a855f7); color: #fff;
    }
    .btn-goto:hover { filter: brightness(1.1); transform: translateY(-1px); }
    .sorted-url {
      font-size: 10px; color: #3f3f46;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      margin-top: 2px;
    }
    .sort-status {
      font-size: 11px; color: #52525b; font-style: italic;
      border-top: 1px solid rgba(255,255,255,0.06);
      padding-top: 8px; margin-top: 4px;
    }
    .sort-export {
      padding: 4px 16px 12px;
      display: flex; gap: 6px;
    }
    .sort-helper {
      font-size: 11px; color: #3f3f46; text-align: center; padding: 6px 0 0;
      font-style: italic;
    }

    /* Save row with tag dropdown */
    .save-row {
      display: flex; gap: 0;
    }
    .save-main-btn {
      flex: 1; border-radius: 10px 0 0 10px !important;
    }
    .tag-dropdown-btn {
      padding: 0 12px;
      background: linear-gradient(135deg, #6d28d9, #9333ea);
      color: #fff;
      border: none;
      border-left: 1px solid rgba(255,255,255,0.2);
      border-radius: 0 10px 10px 0;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s ease;
      display: flex; align-items: center; gap: 2px;
    }
    .tag-dropdown-btn:hover { filter: brightness(1.15); }

    .selected-tags-row {
      display: flex; flex-wrap: wrap; gap: 4px; padding: 2px 0;
    }
    .tag-pill {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 10px; font-weight: 600;
      padding: 2px 8px; border-radius: 20px;
      background: rgba(124, 58, 237, 0.15); color: #a78bfa;
      border: 1px solid rgba(124, 58, 237, 0.25);
    }
    .tag-remove {
      cursor: pointer; font-size: 12px; opacity: 0.7;
      transition: opacity 0.15s;
    }
    .tag-remove:hover { opacity: 1; }

    .tag-dropdown-panel {
      background: #1a1a2e;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 8px;
    }
    .tag-list {
      display: flex; flex-wrap: wrap; gap: 4px;
      max-height: 100px; overflow-y: auto;
      margin-bottom: 8px;
    }
    .tag-option {
      font-size: 11px; padding: 4px 10px;
      border-radius: 6px; border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.04); color: #a1a1aa;
      cursor: pointer; transition: all 0.15s;
    }
    .tag-option:hover { background: rgba(124, 58, 237, 0.15); color: #c4b5fd; border-color: rgba(124, 58, 237, 0.3); }
    .tag-option.active { background: rgba(124, 58, 237, 0.2); color: #a78bfa; border-color: rgba(124, 58, 237, 0.4); }

    .tag-new-row {
      display: flex; gap: 4px;
    }
    .tag-new-row input {
      flex: 1; padding: 5px 8px; font-size: 11px;
      border-radius: 6px;
    }
    .tag-add-btn {
      padding: 4px 10px; font-size: 13px; font-weight: 700;
      background: rgba(124, 58, 237, 0.15); color: #a78bfa;
      border: 1px solid rgba(124, 58, 237, 0.25);
      border-radius: 6px; cursor: pointer;
      transition: all 0.15s;
    }
    .tag-add-btn:hover { background: rgba(124, 58, 237, 0.25); }

    /* Create from Inspo */
    .btn-secondary-alt {
      height: 44px;
      background: linear-gradient(135deg, #4c1d95, #6d28d9);
      color: #fff;
      box-shadow: 0 2px 12px rgba(109, 40, 217, 0.2);
    }
    .btn-secondary-alt:hover:not(:disabled) { filter: brightness(1.15); box-shadow: 0 4px 16px rgba(109, 40, 217, 0.3); }

    .create-inspo-panel {
      background: #1a1a2e;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 10px 12px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .create-inspo-row { display: flex; gap: 6px; align-items: center; }
    .create-inspo-input { flex: 1; padding: 8px 12px; font-size: 12px; }
    .create-inspo-remove {
      background: none; border: none; color: #71717a; cursor: pointer;
      font-size: 16px; padding: 4px 6px; transition: color 0.15s;
    }
    .create-inspo-remove:hover { color: #ef4444; }
    .create-inspo-actions { display: flex; align-items: center; justify-content: space-between; }

    /* Bookmarks view */
    .bookmark-header {
      margin: 12px 16px 8px;
      padding: 10px 14px;
      background: #1a1a2e;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .bookmark-title { font-size: 14px; font-weight: 700; color: #fff; }
    .bookmark-loading {
      padding: 32px 18px; text-align: center; color: #52525b;
      font-size: 12px; display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .bookmark-controls {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 16px 4px;
    }
    .btn-text {
      background: none; border: none; color: #a78bfa; font-size: 11px;
      cursor: pointer; font-weight: 600; padding: 2px 4px;
      transition: color 0.15s; font-family: 'Inter', sans-serif;
    }
    .btn-text:hover { color: #c4b5fd; }
    .btn-bookmark-action {
      background: rgba(167, 139, 250, 0.1); border: 1px solid rgba(167, 139, 250, 0.3);
      color: #a78bfa; font-size: 11px; cursor: pointer; font-weight: 600;
      padding: 4px 10px; border-radius: 6px; font-family: 'Inter', sans-serif;
      transition: all 0.15s;
    }
    .btn-bookmark-action:hover { background: rgba(167, 139, 250, 0.2); border-color: rgba(167, 139, 250, 0.5); color: #c4b5fd; }
    .bookmark-count {
      font-size: 11px; color: #52525b;
    }
    .bookmark-limit-select {
      margin-left: auto;
      font-size: 11px;
      background: #18181b;
      color: #a1a1aa;
      border: 1px solid #3f3f46;
      border-radius: 6px;
      padding: 2px 6px;
      cursor: pointer;
      outline: none;
    }
    .bookmark-limit-select:focus {
      border-color: #a78bfa;
    }
    .bookmark-list {
      max-height: 320px;
      overflow-y: auto;
      padding: 4px 16px;
    }
    .bookmark-list::-webkit-scrollbar { width: 4px; }
    .bookmark-list::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 2px; }
    .bookmark-item {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 8px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s;
      margin-bottom: 2px;
    }
    .bookmark-item:hover { background: rgba(255,255,255,0.04); }
    .bookmark-item.unchecked { opacity: 0.4; }
    .bookmark-item input[type="checkbox"] {
      width: 16px; height: 16px; flex-shrink: 0;
      accent-color: #7c3aed; cursor: pointer;
    }
    .bookmark-thumb {
      width: 40px; height: 40px; border-radius: 6px;
      object-fit: cover; flex-shrink: 0; background: #27272a;
    }
    .bookmark-thumb-placeholder { display: flex; align-items: center; justify-content: center; }
    .bookmark-thumb-placeholder.tiktok { background: rgba(255,255,255,0.06); }
    .bookmark-thumb-placeholder.instagram { background: linear-gradient(135deg, rgba(240,148,51,0.15), rgba(188,24,136,0.15)); }
    .bookmark-label {
      flex: 1; min-width: 0;
      font-size: 11px; color: #a1a1aa;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .bookmark-views {
      font-size: 10px; font-weight: 700; color: #71717a;
      background: rgba(255,255,255,0.06);
      padding: 2px 6px; border-radius: 4px; flex-shrink: 0;
    }
    .bookmark-footer {
      padding: 10px 16px 14px;
      border-top: 1px solid rgba(255,255,255,0.06);
      display: flex; flex-direction: column; gap: 6px;
    }
    .bookmark-hint {
      font-size: 10px; color: #3f3f46; text-align: center; font-style: italic;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="popup.js"></script>
</body>
</html>
