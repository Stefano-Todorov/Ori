<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orianna</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      background: #09090b;
      color: #fafafa;
      min-height: 200px;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px 10px;
      border-bottom: 1px solid #27272a;
    }
    .logo { font-weight: 700; font-size: 15px; letter-spacing: -0.3px; }
    .user-email { font-size: 11px; color: #71717a; max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .logout-btn { font-size: 11px; color: #71717a; cursor: pointer; background: none; border: none; color: #71717a; }
    .logout-btn:hover { color: #ef4444; }

    /* Login form */
    .login-section { padding: 16px 14px; }
    .login-section h2 { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
    .login-section p { color: #71717a; font-size: 12px; margin-bottom: 14px; }

    /* Detected data panel */
    .detected {
      margin: 10px 14px;
      padding: 10px 12px;
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 8px;
    }
    .detected-label { font-size: 10px; color: #71717a; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
    .detected-platform { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
    .platform-badge {
      font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 4px;
      background: #27272a; color: #a1a1aa;
    }
    .detected-handle { font-size: 12px; color: #a1a1aa; }
    .stats-row { display: flex; gap: 12px; margin-bottom: 6px; }
    .stat { }
    .stat-num { font-size: 13px; font-weight: 600; }
    .stat-label { font-size: 10px; color: #71717a; }
    .detected-caption { font-size: 11px; color: #a1a1aa; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .audio-row { font-size: 11px; color: #71717a; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* Not on a post */
    .no-post {
      padding: 20px 14px;
      text-align: center;
      color: #71717a;
      font-size: 12px;
      line-height: 1.5;
    }

    /* Actions */
    .actions { padding: 8px 14px 14px; display: flex; flex-direction: column; gap: 8px; }

    /* Competitor selector */
    .competitor-row { display: flex; gap: 6px; align-items: center; }
    .competitor-label { font-size: 11px; color: #71717a; white-space: nowrap; }

    /* Ideas result */
    .ideas-result { padding: 10px 14px 14px; }
    .ideas-result h3 { font-size: 13px; font-weight: 600; margin-bottom: 10px; color: #4ade80; }
    .idea-item { padding: 8px 10px; background: #18181b; border: 1px solid #27272a; border-radius: 6px; margin-bottom: 6px; }
    .idea-num { font-size: 10px; color: #71717a; margin-bottom: 2px; }
    .idea-text { font-size: 12px; line-height: 1.4; }
    .idea-hook { font-size: 11px; color: #a1a1aa; margin-top: 3px; font-style: italic; }

    /* Shared */
    input, select {
      width: 100%;
      padding: 7px 10px;
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 6px;
      color: #fafafa;
      font-size: 12px;
      outline: none;
    }
    input:focus, select:focus { border-color: #6366f1; }
    input::placeholder { color: #52525b; }

    .btn {
      width: 100%;
      padding: 9px 12px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: opacity 0.15s;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: #6366f1; color: #fff; }
    .btn-primary:hover:not(:disabled) { background: #4f46e5; }
    .btn-outline { background: transparent; color: #fafafa; border: 1px solid #27272a; }
    .btn-outline:hover:not(:disabled) { background: #18181b; }
    .btn-ai { background: #18181b; color: #fafafa; border: 1px solid #27272a; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-ai:hover:not(:disabled) { border-color: #6366f1; color: #a5b4fc; }
    .btn-link { background: none; border: none; color: #6366f1; font-size: 12px; cursor: pointer; padding: 4px 0; text-align: center; width: 100%; }

    .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-msg { font-size: 11px; color: #ef4444; text-align: center; padding: 4px 0; }
    .success-msg { font-size: 11px; color: #4ade80; text-align: center; padding: 4px 0; }

    .divider { height: 1px; background: #27272a; margin: 4px 0; }

    .section-label {
      font-size: 10px; color: #52525b; text-transform: uppercase;
      letter-spacing: 0.06em; padding: 0 14px; margin-top: 4px;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="popup.js"></script>
</body>
</html>
