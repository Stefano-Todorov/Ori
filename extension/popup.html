<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orianna</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 420px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      background: #09090b;
      color: #fafafa;
      min-height: 200px;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px 10px;
      border-bottom: 1px solid #27272a;
    }
    .logo { font-weight: 700; font-size: 15px; letter-spacing: -0.3px; }
    .user-email { font-size: 11px; color: #71717a; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .logout-btn { font-size: 11px; cursor: pointer; background: none; border: none; color: #71717a; }
    .logout-btn:hover { color: #ef4444; }

    /* Login form */
    .login-section { padding: 16px 14px; }
    .login-section h2 { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
    .login-section p { color: #71717a; font-size: 12px; margin-bottom: 14px; }

    /* Detected data panel */
    .detected {
      margin: 10px 14px;
      padding: 10px 12px;
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 8px;
    }
    .detected-row { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
    .platform-badge {
      font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 4px;
      background: #27272a; color: #a1a1aa; text-transform: uppercase;
    }
    .detected-handle { font-size: 12px; color: #e4e4e7; font-weight: 500; }
    .competitor-tag {
      font-size: 9px; font-weight: 600; padding: 2px 6px; border-radius: 4px;
      background: rgba(99, 102, 241, 0.15); color: #818cf8; text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .stats-row { display: flex; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
    .stat-num { font-size: 13px; font-weight: 600; }
    .stat-num.eng { color: #fbbf24; }
    .stat-label { font-size: 10px; color: #71717a; }

    .tracked-info { font-size: 11px; color: #818cf8; margin-bottom: 6px; }

    .detected-caption { font-size: 11px; color: #a1a1aa; line-height: 1.4; margin-bottom: 4px; }

    .hashtag-row { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 4px; }
    .hashtag { font-size: 10px; color: #6366f1; background: rgba(99, 102, 241, 0.1); padding: 1px 5px; border-radius: 3px; }

    .audio-row { font-size: 11px; color: #71717a; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* Not on a post */
    .no-post {
      padding: 24px 14px;
      text-align: center;
      color: #71717a;
      font-size: 12px;
      line-height: 1.5;
    }

    /* Notes */
    .notes-row { padding: 0 14px; margin-bottom: 4px; }

    /* Actions */
    .actions { padding: 8px 14px 14px; display: flex; flex-direction: column; gap: 6px; }

    /* Ideas result */
    .ideas-result { padding: 10px 14px 14px; }
    .ideas-result h3 { font-size: 13px; font-weight: 600; margin-bottom: 10px; color: #4ade80; }
    .idea-item { padding: 8px 10px; background: #18181b; border: 1px solid #27272a; border-radius: 6px; margin-bottom: 6px; }
    .idea-num { font-size: 10px; color: #71717a; margin-bottom: 2px; }
    .idea-text { font-size: 12px; line-height: 1.4; }
    .idea-hook { font-size: 11px; color: #a1a1aa; margin-top: 3px; font-style: italic; }

    /* Shared */
    input, select {
      width: 100%;
      padding: 7px 10px;
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 6px;
      color: #fafafa;
      font-size: 12px;
      outline: none;
    }
    input:focus, select:focus { border-color: #6366f1; }
    input::placeholder { color: #52525b; }

    .btn {
      width: 100%;
      padding: 9px 12px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: all 0.15s;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: #6366f1; color: #fff; }
    .btn-primary:hover:not(:disabled) { background: #4f46e5; }
    .btn-outline { background: transparent; color: #fafafa; border: 1px solid #27272a; }
    .btn-outline:hover:not(:disabled) { background: #18181b; border-color: #3f3f46; }
    .btn-ai { background: linear-gradient(135deg, #312e81, #1e1b4b); color: #c7d2fe; border: 1px solid #4338ca; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-ai:hover:not(:disabled) { border-color: #6366f1; color: #e0e7ff; }
    .btn-link { background: none; border: none; color: #6366f1; font-size: 12px; cursor: pointer; padding: 4px 0; text-align: center; width: 100%; text-decoration: none; display: block; }

    .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-msg { font-size: 11px; color: #ef4444; text-align: center; padding: 2px 0; }
    .success-msg { font-size: 11px; color: #4ade80; text-align: center; padding: 2px 0; }

    .divider { height: 1px; background: #27272a; margin: 2px 0; }

    /* Competitor prompt */
    .competitor-prompt {
      padding: 8px 10px;
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 6px;
    }
    .competitor-prompt-text { font-size: 12px; color: #a1a1aa; margin-bottom: 6px; }
    .competitor-prompt-actions { display: flex; align-items: center; gap: 8px; }
    .btn-prompt-yes, .btn-prompt-no {
      padding: 4px 14px; font-size: 11px; font-weight: 600;
      border-radius: 4px; cursor: pointer; border: none;
      transition: all 0.15s;
    }
    .btn-prompt-yes { background: #6366f1; color: #fff; }
    .btn-prompt-yes:hover { background: #4f46e5; }
    .btn-prompt-no { background: #27272a; color: #a1a1aa; }
    .btn-prompt-no:hover { background: #3f3f46; color: #e4e4e7; }
    .dont-ask-label {
      font-size: 10px; color: #52525b; display: flex; align-items: center; gap: 4px;
      cursor: pointer; margin-left: auto; user-select: none;
    }
    .dont-ask-label input { width: 12px; height: 12px; accent-color: #6366f1; }

    /* Analysis result */
    .analysis-result {
      margin: 6px 14px 10px;
      padding: 10px 12px;
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 8px;
    }
    .analysis-title { font-size: 12px; font-weight: 600; color: #4ade80; margin-bottom: 6px; }
    .analysis-text { font-size: 11px; color: #a1a1aa; line-height: 1.5; }
    .analysis-bullet { margin-bottom: 4px; }
    .analysis-bullet strong { color: #e4e4e7; }

    /* Profile view */
    .profile-header {
      margin: 10px 14px 6px;
      padding: 8px 12px;
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .profile-actions { padding: 0 14px 8px; }

    .sort-label { font-size: 12px; color: #71717a; text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap; }

    /* Sort controls */
    .sort-box {
      margin: 6px 14px;
      padding: 10px 12px;
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 8px;
    }
    .sort-controls {
      display: flex; align-items: center; gap: 6px;
      flex-wrap: wrap;
    }
    .sort-controls select {
      width: auto; padding: 6px 10px; font-size: 12px;
    }
    .sort-controls .btn { width: auto; padding: 9px 26px; font-size: 13px; }

    /* Sorted list */
    .sorted-list {
      max-height: 460px;
      overflow-y: auto;
      padding: 6px 14px 10px;
    }
    .sorted-list::-webkit-scrollbar { width: 4px; }
    .sorted-list::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 2px; }
    .sorted-item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 10px;
      border-radius: 6px;
      text-decoration: none;
      color: #fafafa;
      transition: background 0.15s;
    }
    .sorted-item:hover { background: #18181b; }
    .sorted-rank {
      font-size: 14px; font-weight: 700; color: #818cf8;
      min-width: 24px; text-align: center;
    }
    .sorted-thumb {
      width: 56px; height: 56px; border-radius: 4px;
      object-fit: cover; background: #27272a; flex-shrink: 0;
    }
    .sorted-metrics { flex: 1; min-width: 0; }
    .sorted-metric-row {
      display: flex; gap: 10px; font-size: 12px; color: #a1a1aa;
    }
    .sorted-metric-row .val { font-weight: 600; color: #e4e4e7; }
    .sorted-metric-row .primary { color: #818cf8; font-weight: 700; }
    .sorted-actions {
      display: flex; gap: 4px; flex-shrink: 0;
    }
    .sorted-actions button {
      padding: 4px 10px; font-size: 10px; font-weight: 600;
      border-radius: 4px; cursor: pointer; border: none;
      transition: all 0.15s; white-space: nowrap;
    }
    .btn-open {
      background: #27272a; color: #a1a1aa;
    }
    .btn-open:hover { background: #3f3f46; color: #e4e4e7; }
    .btn-goto {
      background: #6366f1; color: #fff;
    }
    .btn-goto:hover { background: #4f46e5; }
    .sorted-url {
      font-size: 10px; color: #52525b;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .sort-status { font-size: 11px; color: #71717a; }
    .sort-export {
      padding: 4px 14px 10px;
      display: flex; gap: 6px;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="popup.js"></script>
</body>
</html>
